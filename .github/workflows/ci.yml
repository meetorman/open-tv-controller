name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Wheel and sdist
        run: uv build
      - name: The wheel installs and runs
        run: |
          uv tool install dist/*.whl
          orman-tv-controller --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Container image (amd64)
        run: |
          docker build -t orman-tv-controller:ci .
          docker run --rm orman-tv-controller:ci --version
