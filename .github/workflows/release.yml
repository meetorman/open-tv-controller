# A tag vX.Y.Z publishes the wheel and sdist on the GitHub release, and the
# multi-arch image (amd64, arm64) as ghcr.io/meetorman/open-tv-controller.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$want" = "$have" || { echo "tag $want, pyproject $have"; exit 1; }
      - run: uv build
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/meetorman/open-tv-controller:${{ github.ref_name }}
            ghcr.io/meetorman/open-tv-controller:latest
